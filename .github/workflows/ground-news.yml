name: Ground News Like Pipeline

on:
  schedule:
    # 复用现有 morning_evening 调度：早 07:30 / 晚 19:30 (UTC+8)
    # GitHub Actions 使用 UTC，所以减 8 小时
    - cron: '30 23 * * *'   # UTC 23:30 = 北京时间 07:30
    - cron: '30 11 * * *'   # UTC 11:30 = 北京时间 19:30
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式'
        type: choice
        options: ['full', 'fetch_only', 'extract_only', 'embed_only', 'bias_only', 'report_only', 'push_only']
        default: 'full'

concurrency:
  group: ground-news-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (with ground-news extra)
        run: uv sync --frozen --no-dev --extra ground-news

      - name: Install spaCy models
        run: |
          uv run python -m spacy download zh_core_web_sm
          uv run python -m spacy download en_core_web_sm

      - name: Verify config
        run: |
          if [ ! -f config/ground_news/sources.yaml ]; then
            echo "Error: config/ground_news/sources.yaml missing"
            exit 1
          fi

      - name: Run Ground News Pipeline
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # COS 存储（复用 TrendRadar RemoteStorageBackend）
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          # Cloudflare Pages 链接
          CF_PAGES_URL: ${{ vars.CF_PAGES_URL || 'https://master.tr02.pages.dev' }}
          GITHUB_ACTIONS: true
        run: |
          set -e
          MODE="${{ github.event.inputs.run_mode || 'full' }}"
          echo "🚀 Ground News Pipeline - Mode: $MODE"

          if [ "$MODE" = "full" ] || [ "$MODE" = "fetch_only" ]; then
            echo "📡 Step 1: Fetch Sources (RSS + agent-reach)"
            uv run ground-news-fetch
          fi

          if [ "$MODE" = "full" ] || [ "$MODE" = "push_only" ]; then
            echo "📤 Step 6: Push to Feishu (with CF Pages link)"
            uv run ground-news-push
          fi

          echo "📄 Generate Ground News HTML (TF-IDF clustering)"
          uv run python scripts/ground_news/generate_html.py

          echo "✅ Pipeline completed successfully"

      # ---------- Cloudflare Pages 部署 ----------
      - name: Check Cloudflare config
        if: success()
        id: cf_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ CF config detected, preparing Cloudflare Pages deploy"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No CF secrets, skipping Cloudflare Pages deploy"
          fi

      - name: Prepare Cloudflare Pages assets
        if: success() && steps.cf_check.outputs.enabled == 'true'
        run: |
          mkdir -p cloudflare_dist
          cp output/ground_news/index.html cloudflare_dist/index.html
          echo "📦 Asset prepared: cloudflare_dist/index.html"

      - name: Deploy to Cloudflare Pages
        if: success() && steps.cf_check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}