name: Ground News Like Pipeline

on:
  schedule:
    # 复用现有 morning_evening 调度：早 07:30 / 晚 19:30 (UTC+8)
    # GitHub Actions 使用 UTC，所以减 8 小时
    - cron: '30 23 * * *'   # UTC 23:30 = 北京时间 07:30
    - cron: '30 11 * * *'   # UTC 11:30 = 北京时间 19:30
  workflow_dispatch:
    inputs:
      run_mode:
        description: '运行模式'
        type: choice
        options: ['full', 'fetch_only', 'extract_only', 'embed_only', 'bias_only', 'report_only', 'push_only']
        default: 'full'

concurrency:
  group: ground-news-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (with ground-news extra)
        run: uv sync --frozen --no-dev --extra ground-news

      - name: Install spaCy models
        run: |
          uv run python -m spacy download zh_core_web_sm
          uv run python -m spacy download en_core_web_sm

      - name: Verify config
        run: |
          if [ ! -f config/ground_news/sources.yaml ]; then
            echo "Error: config/ground_news/sources.yaml missing"
            exit 1
          fi

      - name: Debug COS credentials
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          echo "=== COS Debug ==="
          echo "ENDPOINT: ${S3_ENDPOINT_URL}"
          echo "BUCKET:   ${S3_BUCKET_NAME}"
          echo "REGION:   '${S3_REGION}'"
          echo "contains myqcloud: $(echo ${S3_ENDPOINT_URL} | grep -c myqcloud || echo 0)"
          echo "contains bucket in url: $(echo ${S3_ENDPOINT_URL} | grep -c ${S3_BUCKET_NAME} || echo 0)"

      - name: Run Ground News Pipeline
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_ACTIONS: true
        run: |
          set -e
          MODE="${{ github.event.inputs.run_mode || 'full' }}"
          echo "🚀 Ground News Pipeline - Mode: $MODE"

          if [ "$MODE" = "full" ] || [ "$MODE" = "fetch_only" ]; then
            echo "📡 Step 1: Fetch Sources (stdout mode)"
            uv run ground-news-fetch
          fi

          echo "✅ Pipeline completed successfully (COS writes disabled — pending COS auth fix)"