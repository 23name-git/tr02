# Ground News Like Pipeline - 新闻源配置
# 20 个中英文主流媒体 RSS 源，覆盖政治、科技、财经、国际、行业

rss_feeds:
  # === 英文主流媒体 (10) ===
  - id: "reuters_world"
    name: "Reuters World News"
    url: "https://www.reuters.com/world/rss"
    enabled: true
    category: "international"
    bias_reference: "reuters.com"  # 参考偏见评分表中的域名

  - id: "ap_news"
    name: "Associated Press"
    url: "https://apnews.com/rss"
    enabled: true
    category: "general"
    bias_reference: "apnews.com"

  - id: "bbc_world"
    name: "BBC World"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    enabled: true
    category: "international"
    bias_reference: "bbc.com"

  - id: "nytimes_world"
    name: "NYTimes World"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
    enabled: true
    category: "international"
    bias_reference: "nytimes.com"

  - id: "washington_post"
    name: "Washington Post"
    url: "https://feeds.washingtonpost.com/rss/world"
    enabled: true
    category: "politics"
    bias_reference: "washingtonpost.com"

  - id: "guardian_world"
    name: "The Guardian World"
    url: "https://www.theguardian.com/world/rss"
    enabled: true
    category: "international"
    bias_reference: "theguardian.com"

  - id: "economist"
    name: "The Economist"
    url: "https://www.economist.com/international/rss.xml"
    enabled: true
    category: "analysis"
    bias_reference: "economist.com"

  - id: "ft_world"
    name: "Financial Times World"
    url: "https://www.ft.com/rss/world"
    enabled: true
    category: "finance"
    bias_reference: "ft.com"

  - id: "wsj_world"
    name: "Wall Street Journal World"
    url: "https://feeds.wsj.com/xml/rss/3_7085.xml"
    enabled: true
    category: "finance"
    bias_reference: "wsj.com"

  - id: "cnn_world"
    name: "CNN World"
    url: "http://rss.cnn.com/rss/edition_world.rss"
    enabled: true
    category: "international"
    bias_reference: "cnn.com"

  # === 中文主流媒体 (8) ===
  - id: "xinhua"
    name: "新华社"
    url: "https://www.xinhuanet.com/politics/gnjxs.xml"
    enabled: true
    category: "china_politics"
    bias_reference: "xinhuanet.com"

  - id: "people_daily"
    name: "人民网"
    url: "http://www.people.com.cn/rss/politics.xml"
    enabled: true
    category: "china_politics"
    bias_reference: "people.com.cn"

  - id: "caixin"
    name: "财新网"
    url: "https://www.caixin.com/rss.xml"
    enabled: true
    category: "finance"
    bias_reference: "caixin.com"

  - id: "thepaper"
    name: "澎湃新闻"
    url: "https://www.thepaper.cn/rss_25950.xml"
    enabled: true
    category: "general"
    bias_reference: "thepaper.cn"

  - id: "jiemian"
    name: "界面新闻"
    url: "https://www.jiemian.com/rss.xml"
    enabled: true
    category: "general"
    bias_reference: "jiemian.com"

  - id: "36kr"
    name: "36氪"
    url: "https://36kr.com/feed"
    enabled: true
    category: "tech"
    bias_reference: "36kr.com"

  - id: "huxiu"
    name: "虎嗅网"
    url: "https://www.huxiu.com/rss.xml"
    enabled: true
    category: "tech"
    bias_reference: "huxiu.com"

  - id: "ifeng"
    name: "凤凰网"
    url: "https://news.ifeng.com/rss/index.xml"
    enabled: true
    category: "general"
    bias_reference: "ifeng.com"

  # === 垂直/行业媒体 (2) ===
  - id: "techcrunch"
    name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
    enabled: true
    category: "tech"
    bias_reference: "techcrunch.com"

  - id: "mit_tech_review"
    name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
    enabled: true
    category: "tech"
    bias_reference: "technologyreview.com"


# Agent-Reach 搜索查询配置（占位，待 agent-reach CLI 集成后启用）
agent_reach_queries:
  - query: "AI 产品运营 招聘"
    platforms: ["xiaohongshu", "bilibili", "twitter", "linkedin"]
    enabled: false

  - query: "手作饰品 选品 趋势"
