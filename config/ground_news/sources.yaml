# agent-reach 搜索（Exa API + B站）
agent_reach:
  enabled: true
  platforms:
    - {name: exa_search, type: web, queries: ["今日热点新闻", "AI artificial intelligence latest news", "中美关系 latest", "全球财经重要新闻", "科技突破 discovery"]}
    - {name: bilibili, type: social, command: "bili search '{query}' --type video -n 5", queries: ["今日热点", "AI 人工智能"]}
  max_per_query: 10
  timeout_seconds: 60