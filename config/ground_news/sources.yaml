# agent-reach 搜索配置（中文社交媒体 + 搜索引擎）
agent_reach:
  enabled: true
  platforms:
    # 综合搜索（Exa AI）
    - name: exa_search
      type: web
      queries:
        - "今日热点新闻"
        - "AI artificial intelligence latest news"
        - "中美关系 latest"
    # B站热搜（无需登录）
    - name: bilibili
      type: social
      command: "bili search '{query}' --type video -n 5"
      queries:
        - "今日热点"
        - "AI 人工智能"
  max_per_query: 10
  timeout_seconds: 60
