# Ground News 源清单（35→17 活跃源，已验证可用）
rss_feeds:
  # ===== 国际主流（英文，全部存活）=====
  - {id: bbc_world, name: "BBC World", url: "https://feeds.bbci.co.uk/news/world/rss.xml", category: world, bias_reference: bbc.com, language: en}
  - {id: nytimes_world, name: "NYTimes World", url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", category: world, bias_reference: nytimes.com, language: en}
  - {id: wapo_world, name: "Washington Post", url: "https://feeds.washingtonpost.com/rss/world", category: world, bias_reference: washingtonpost.com, language: en}
  - {id: guardian_world, name: "The Guardian", url: "https://www.theguardian.com/world/rss", category: world, bias_reference: theguardian.com, language: en}
  - {id: economist_intl, name: "The Economist", url: "https://www.economist.com/international/rss.xml", category: world, bias_reference: economist.com, language: en}
  - {id: ft_world, name: "Financial Times", url: "https://www.ft.com/rss/world", category: world, bias_reference: ft.com, language: en}
  - {id: cnn_world, name: "CNN World", url: "http://rss.cnn.com/rss/edition_world.rss", category: world, bias_reference: cnn.com, language: en}
  - {id: scmp_news, name: "南华早报 SCMP", url: "https://www.scmp.com/rss/91/feed", category: asia, bias_reference: scmp.com, language: en}
  - {id: aljazeera, name: "Al Jazeera", url: "https://www.aljazeera.com/xml/rss/all.xml", category: world, bias_reference: aljazeera.com, language: en}

  # ===== 中文源（已验证可用）=====
  - {id: people_cn, name: "人民网", url: "http://www.people.com.cn/rss/politics.xml", category: china, bias_reference: people.com.cn, language: zh}
  - {id: ithome, name: "IT之家", url: "https://www.ithome.com/rss/", category: tech, bias_reference: ithome.com, language: zh}

  # ===== 科技源 =====
  - {id: techcrunch, name: "TechCrunch", url: "https://techcrunch.com/feed/", category: tech, bias_reference: techcrunch.com, language: en}
  - {id: mit_tech_review, name: "MIT Technology Review", url: "https://www.technologyreview.com/feed/", category: tech, bias_reference: technologyreview.com, language: en}
  - {id: hackernews, name: "Hacker News", url: "https://hnrss.org/frontpage", category: tech, bias_reference: ycombinator.com, language: en}
  - {id: verge, name: "The Verge", url: "https://www.theverge.com/rss/index.xml", category: tech, bias_reference: theverge.com, language: en}
  - {id: ars_technica, name: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index", category: tech, bias_reference: arstechnica.com, language: en}
  - {id: wired, name: "Wired", url: "https://www.wired.com/feed/rss", category: tech, bias_reference: wired.com, language: en}

