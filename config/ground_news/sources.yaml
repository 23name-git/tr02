    enabled: false

  - query: "韩系 服饰 选品 日本 供应链"
    platforms: ["xiaohongshu", "bilibili", "twitter"]
    enabled: false

  - query: "AIGC 内容运营 工具"
    platforms: ["twitter", "reddit", "bilibili"]
    enabled: false