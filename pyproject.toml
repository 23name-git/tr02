[project]
name = "trendradar"
version = "6.10.0"
description = "TrendRadar - 热点新闻聚合与分析工具"
requires-python = ">=3.12"
dependencies = [
    "requests==2.33.0",
    "pytz==2026.1",
    "PyYAML==6.0.3",
    "fastmcp==2.12.5",
    "websockets==13.1",
    "feedparser==6.0.12",
    "boto3==1.42.76",
    "litellm==1.82.6",
    "json-repair==0.58.6",
    "tenacity==8.5.0",
    "jieba==0.42.1",
]

[project.optional-dependencies]
ground-news = [
    "trafilatura>=1.6.0",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.5",
    "langdetect>=1.0.9",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
trendradar = "trendradar.__main__:main"
trendradar-mcp = "mcp_server.server:run_server"
ground-news-fetch = "scripts.ground_news.fetch_sources:main"
ground-news-extract = "scripts.ground_news.extract_clean:main"
ground-news-embed = "scripts.ground_news.embed_cluster:main"
ground-news-bias = "scripts.ground_news.bias_label:main"
ground-news-report = "scripts.ground_news.generate_bias_bar:main"
ground-news-push = "scripts.ground_news.push_feishu:main"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendradar", "mcp_server"]
